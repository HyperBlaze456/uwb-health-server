# 논문 찾기 평가의 질의 묶음 (SPEC RP-6). 읽는 도구: tools/eval_retrieval.py
#
# 묶음 두 개:
# - metric: contracts/metrics.toml에서 sources가 비지 않은 지표마다 질문 하나(27개). 지표의 label과 meaning을 보고
#   "이 지표가 임상적으로 무엇을 뜻하는가, 무엇과 관련되는가"를 영어로 썼습니다. 정답(relevant)은 그 지표의 sources
#   가운데 논문 저장소에 있는 key입니다(2026-11-12 기준 모두 있음). 질문을 쓸 때 정답 논문의 본문은 보지 않았습니다.
#   지표 → 논문 짝은 검색 시스템과 무관하게 ../gaitfusion/gait-features.md에서 사람이 정한 것입니다.
# - known_item: 논문 52편마다 질문 하나. 그 논문의 첫 대목들(제목과 초록)을 읽고 그 논문이 답하는 물음(방법이나 결과)을
#   영어로 썼습니다. 제목에만 나오는 드문 낱말, 저자 이름, 고유 약어(자료·과제·기기 이름)는 쓰지 않고 뜻을 풀어 썼습니다.
#   정답은 그 논문 key 하나입니다.
#
# 항목: id, group, query, relevant(논문 key 목록), how(만든 방법 한 줄).
#
# 한계:
# - 정답이 아닌 논문도 실제로는 질문과 관련될 수 있습니다(특히 metric 묶음: 보행 속도나 변동을 다룬 논문이 여럿).
#   그런 논문이 먼저 나오면 틀린 것으로 세므로 적중률은 실제 쓸모보다 낮게 나옵니다.
# - 질문은 언어 모델(Claude)이 썼습니다. 사람이 쓴 질문이나 보고서 모델이 실제로 만드는 질문과 말씨가 다를 수 있습니다.
# - known_item 질문은 초록을 보고 썼으므로 초록 대목과 낱말이 일부 겹칩니다. 드문 낱말은 풀어 썼지만 흔한 낱말
#   (Parkinson's disease, stroke, falls 등)은 그대로라 단어 맞춤(BM25)에 조금 유리할 수 있습니다.
# - 질문마다 하나씩이고 수가 적어(79개) 방식 사이의 작은 차이는 우연일 수 있습니다.
#
# 이 파일을 고치면 결과(report/data/rag_retrieval.json의 queries_sha256)가 달라집니다. 결과를 보고 질문이나 정답을
# 고치지 않습니다.

