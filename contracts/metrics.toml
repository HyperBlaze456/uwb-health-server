# --- 기간 지표 (서버, period_values가 RP-3의 rule로 계산) -------------------------------------
# 줄의 값에서 계산하는 지표는 길이 10초 이상 걷기 구간만, 변동(cv, sd)은 30초 이상(RP-3).
# by_side = false이고 줄의 값을 쓰면 걷기 구간마다 주 발의 줄만 씀(RP-3).

# 자료 범위

