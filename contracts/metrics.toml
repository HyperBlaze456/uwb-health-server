# C4 지표 목록 (SPEC 14.4 MC). 분석 값의 이름·단위·뜻의 기준입니다.
#
# 읽는 코드: src/uwbserver/pipeline/metrics.py. 검사: tests/contract/metrics/ (MC-7).
# 근거 문헌과 고른 이유는 ../gaitfusion/gait-features.md가 설명하고, 이름·단위·뜻이 다르면 이 파일이 이깁니다.
# sources의 key는 gait-features.md "출처"의 논문을 <첫 저자 성 소문자><연도>로 적은 것입니다(논문 저장소의 key, RP-5).
#
# 고치는 법(MC-4):
# - gaitfusion이 새 필드를 내기 시작함 → [[metric]] 항목을 더함.
# - 필드 이름이 바뀜 → 그 지표에 names = { "<형식>" = { name = "<새 이름>" } }.
# - 판이 오름(/2) → 그 [[table]]의 formats에 판을 더하고, 달라진 지표에 names(이름, scale).
# - 한번 쓴 id는 다른 뜻으로 다시 쓰지 않습니다.
#
# trust(MC-1): validated = 문헌이 같은 부위·방법으로 검증 · proxy = 대리 지표 · low = 소규모 연구 ·
# unverified = 우리 센서 위치(발목 외측 + UWB)에서 검증 없음. gait-features.md 0절 5번대로 자유 생활 검증은 거의 허리
# 센서이므로, 발목 센서로 검증된 것(SV95C)만 validated로 두었습니다.

version = 1

# --- 표: 응답 bouts[] 안의 배열 하나 = 줄의 종류 하나 (MC-3) ---------------------------------

[[table]]
field = "strides"
level = "stride"
formats = ["gaitfusion.stride/1"]
keys = { start = "start_s", end = "end_s", side = "side" }

[[table]]
field = "steps"
level = "step"
formats = ["gaitfusion.step/1"]
keys = { start = "start_s", end = "end_s", side = "side" }

[[table]]
field = "turns"
level = "turn"
formats = ["gaitfusion.turn/1"]
keys = { start = "start_s", end = "end_s", side = "side" }

[[table]]
field = "windows"
level = "window"
formats = ["gaitfusion.window/1"]
keys = { start = "start_s", end = "end_s", side = "side" }

[[table]]
field = "events"
level = "event"
formats = ["gaitfusion.event/1"]
keys = { start = "start_s", end = "end_s", side = "side" }

# --- 보폭 줄 (gaitfusion, gaitfusion.stride/1) --------------------------------------------
# 보폭 한 줄 = 한 발의 연속한 두 정지의 가운데 사이(MC-6). gaitfusion service.md 4절, gait-features.md 3절.

[[metric]]
id = "stride.duration_s"
level = "stride"
type = "number"
unit = "s"
range = [0.0, 10.0]
producer = "gaitfusion"
show = "detail"
needs = "one_foot"
trust = "unverified"
label = "보폭 시간"
meaning = "보폭 하나의 시간. 보폭은 한 발의 연속한 두 정지의 가운데 사이(한 발의 걸음 주기 하나)"
sources = []

[[metric]]
id = "stride.length_m"
level = "stride"
type = "number"
unit = "m"
range = [0.0, 3.0]
producer = "gaitfusion"
show = "detail"
needs = "one_foot"
trust = "unverified"
label = "보폭 길이"
meaning = "한 발이 한 번 정지한 곳에서 다음에 정지한 곳까지의 수평 거리"
sources = ["schlachetzki2017", "dias2023"]

[[metric]]
id = "stride.speed_mps"
level = "stride"
type = "number"
unit = "m/s"
range = [0.0, 3.0]
producer = "gaitfusion"
show = "detail"
needs = "one_foot"
trust = "validated"
label = "보폭 속도"
meaning = "보폭 길이를 보폭 시간으로 나눈 속도"
sources = ["schlachetzki2017", "ema2023"]

[[metric]]
id = "stride.clearance_m"
level = "stride"
type = "number"
unit = "m"
range = [0.0, 1.0]
